<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeKeeper — Integrated Prototype</title>
<style>
:root{
  --bg:#F1F1EE;--surface:#fff;--border:#E2E1DB;--text:#1C1C1A;
  --text-secondary:#6B6A63;--accent:#0F6E56;--accent-bg:#E1F5EE;
  --warn:#92400E;--warn-bg:#FDECC8;
}
.phone.disaster{--bg:#FBECE9;--surface:#fff;--border:#F0C9C2;--text:#2A1614;
  --text-secondary:#8C4A3F;--accent:#B3261E;--accent-bg:#FBDAD5;}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:#F1F1EE;display:flex;justify-content:center;padding:32px 16px}
.phone{width:380px;background:var(--bg);border-radius:28px;border:1px solid var(--border);
overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.banner{display:none;align-items:center;gap:8px;background:var(--accent);color:#fff;padding:9px 16px;
font-size:12px;font-weight:600}
.phone.disaster .banner{display:flex}
.content{padding:18px;min-height:560px;background:var(--bg)}
.card{background:var(--surface);border-radius:14px;border:1px solid var(--border)}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.brand{font-weight:700;font-size:16px;color:var(--text)}
.status-pill{display:flex;align-items:center;gap:6px;background:var(--warn-bg);color:var(--warn);
padding:5px 10px;border-radius:999px;font-size:11px;font-weight:600}
.mode-toggle{display:flex;gap:8px;margin-bottom:18px;background:var(--surface);border:1px solid var(--border);
border-radius:999px;padding:4px}
.mode-toggle button{flex:1;padding:9px;border-radius:999px;border:none;background:transparent;font-size:13px;
font-weight:600;cursor:pointer;color:var(--text-secondary)}
.mode-toggle button.active{background:var(--accent);color:#fff}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat-card{padding:14px}.stat-card .label{font-size:12px;color:var(--text-secondary);margin:0 0 4px}
.stat-card .value{font-size:22px;font-weight:700;margin:0;color:var(--text)}
.ai-card{background:var(--accent-bg);border-radius:14px;padding:14px;margin-bottom:14px;border:1px solid var(--border)}
.ai-card .label{font-size:11px;color:var(--accent);font-weight:700;margin:0 0 6px}
.ai-card p.body{font-size:14px;line-height:1.5;margin:0;color:var(--text)}
.agency-strip{display:none;align-items:center;gap:8px;background:var(--accent-bg);border:1px solid var(--accent);
border-radius:10px;padding:9px 12px;font-size:12px;color:var(--accent);font-weight:600;margin-bottom:14px}
.phone.disaster .agency-strip{display:flex}
.action-btn{display:flex;align-items:center;gap:10px;width:100%;padding:13px;border-radius:12px;border:1px solid var(--border);
background:var(--surface);font-size:14px;margin-bottom:8px;cursor:pointer;color:var(--text);text-align:left}
.action-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.action-btn svg{flex-shrink:0}
h2.screen-title{font-size:15px;font-weight:700;margin:0 0 14px;color:var(--text)}
.entry{border-bottom:1px solid var(--border);padding:12px 0}.entry:last-child{border-bottom:none}
.entry .tag{display:inline-block;font-size:11px;padding:3px 8px;border-radius:999px;margin-bottom:6px;
background:var(--accent-bg);color:var(--accent);font-weight:600}
.entry .snippet{font-size:14px;margin:0 0 4px;line-height:1.4;color:var(--text)}
.entry .time{font-size:12px;color:var(--text-secondary)}
.field-label{font-size:12px;color:var(--text-secondary);margin:0 0 4px;font-weight:600}
select,input[type=text],textarea{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
font-size:14px;margin-bottom:14px;font-family:inherit;background:var(--surface);color:var(--text)}
textarea{resize:vertical}.sev-high{color:#B3261E;font-weight:700}.sev-med{color:var(--warn);font-weight:700}
.log-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);
font-size:13px;color:var(--text);gap:8px}.log-item:last-child{border-bottom:0}
.chip-row{display:flex;gap:8px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--surface);
font-size:12px;font-weight:600;color:var(--text);white-space:nowrap;cursor:pointer}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.peer-bar{font-size:12px;color:var(--text-secondary);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.bubble{max-width:75%;padding:10px 12px;border-radius:14px;font-size:14px;margin-bottom:8px;line-height:1.4}
.bubble.them{background:var(--surface);border:1px solid var(--border);border-bottom-left-radius:4px;color:var(--text)}
.bubble.me{background:var(--accent);color:#fff;margin-left:auto;border-bottom-right-radius:4px}
.bubble .meta{font-size:11px;opacity:.7;margin-top:4px}
.chat-compose{display:flex;gap:7px;margin-top:10px}.chat-compose input{margin:0}.chat-compose button{width:70px;
border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;cursor:pointer}
.map-box{position:relative;height:300px;border-radius:14px;background:var(--surface);border:1px solid var(--border);
margin-bottom:10px;overflow:hidden}
#google-map{width:100%;height:100%}
.map-status{font-size:11px;color:var(--text-secondary);margin:0 0 12px}
.map-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.map-actions button{padding:9px;border:1px solid var(--border);background:var(--surface);border-radius:9px;cursor:pointer;
font-size:12px;color:var(--text)}
.legend{display:flex;gap:14px;font-size:11px;color:var(--text-secondary);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:5px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tabbar{display:flex;border-top:1px solid var(--border);background:var(--surface)}
.tabbar button{flex:1;padding:12px 0;background:none;border:none;font-size:10.5px;color:var(--text-secondary);
cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.tabbar button.active{color:var(--accent);font-weight:700}
.small-note{font-size:11px;color:var(--text-secondary);line-height:1.4;margin:8px 0 0}
.empty{padding:18px;text-align:center;color:var(--text-secondary);font-size:13px}


/* ===== LifeKeeper visual refresh ===== */
:root{
  --bg:#eef3f1;--surface:rgba(255,255,255,.94);--border:rgba(28,55,48,.10);
  --text:#17231f;--text-secondary:#65736e;--accent:#0b7a61;--accent-bg:#e4f5ef;
  --warn:#a05a13;--warn-bg:#fff2d9;--shadow:0 18px 45px rgba(25,55,47,.10);
}
*{scrollbar-width:thin;scrollbar-color:#b9c8c2 transparent}
body{
  min-height:100vh;padding:34px 16px;
  background:radial-gradient(circle at 20% 10%,#dff4ec 0,transparent 34%),radial-gradient(circle at 90% 90%,#dce9ff 0,transparent 32%),#edf1ef;
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.35),transparent 45%)}
.phone{
  width:min(420px,100%);border:1px solid rgba(28,55,48,.12);border-radius:34px;
  box-shadow:0 28px 80px rgba(28,55,48,.16),0 2px 8px rgba(28,55,48,.06);
  background:var(--bg);position:relative;isolation:isolate;
}
.phone:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:72px;height:5px;border-radius:10px;background:rgba(28,55,48,.13);z-index:5}
.banner{padding:10px 18px;margin-top:4px;font-size:11px;letter-spacing:.15px;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.content{padding:22px 20px 20px;min-height:610px;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent)}
.topbar{margin:2px 0 20px}
.brand{font-size:20px;letter-spacing:-.4px;display:flex;align-items:center;gap:8px}
.brand:before{content:"✦";display:grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;box-shadow:0 5px 12px rgba(11,122,97,.22)}
.status-pill{background:rgba(255,242,217,.9);border:1px solid rgba(160,90,19,.10);padding:7px 10px;font-size:10px}
.mode-toggle{padding:4px;margin-bottom:20px;box-shadow:0 6px 18px rgba(28,55,48,.06)}
.mode-toggle button{padding:10px;font-size:12px;transition:.2s ease}
.mode-toggle button:hover{transform:translateY(-1px)}
.mode-toggle button.active{box-shadow:0 5px 13px rgba(11,122,97,.20)}
.card{
  border-radius:18px;border-color:var(--border);box-shadow:0 7px 22px rgba(28,55,48,.045);backdrop-filter:blur(10px)
}
.stat-row{gap:12px;margin-bottom:16px}
.stat-card{padding:17px;position:relative;overflow:hidden}
.stat-card:after{content:"";position:absolute;right:-18px;top:-18px;width:58px;height:58px;border-radius:50%;background:var(--accent-bg);opacity:.8}
.stat-card .label{font-size:11px;letter-spacing:.2px;text-transform:uppercase}
.stat-card .value{font-size:25px;letter-spacing:-.7px}
.ai-card{border:0;box-shadow:0 8px 24px rgba(11,122,97,.08);padding:17px;position:relative;overflow:hidden}
.ai-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.ai-card .label{letter-spacing:.4px;text-transform:uppercase}
.ai-card p.body{font-size:13.5px}
.action-btn{border-color:var(--border);border-radius:14px;padding:14px 15px;margin-bottom:9px;box-shadow:0 4px 12px rgba(28,55,48,.035);transition:transform .18s,box-shadow .18s,border-color .18s}
.action-btn:hover{transform:translateY(-2px);box-shadow:0 9px 20px rgba(28,55,48,.09);border-color:rgba(11,122,97,.22)}
.action-btn.primary{box-shadow:0 8px 18px rgba(11,122,97,.20)}
.screen-title{font-size:18px!important;letter-spacing:-.3px;margin-bottom:16px!important}
.field-label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
select,input[type=text],textarea{border-radius:12px;padding:12px;border-color:rgba(28,55,48,.12);box-shadow:inset 0 1px 2px rgba(28,55,48,.025);outline:none;transition:.2s}
select:focus,input[type=text]:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,122,97,.10)}
textarea{line-height:1.5}
.entry{padding:14px 2px}.entry .tag{padding:4px 9px}.entry .snippet{font-size:13.5px}
.log-item{padding:13px 2px;align-items:center}
.chip-row{padding:2px 2px 7px}.chip{box-shadow:0 3px 9px rgba(28,55,48,.04);transition:.18s}.chip:hover{transform:translateY(-1px)}
.peer-bar{background:var(--surface);border:1px solid var(--border);padding:9px 11px;border-radius:10px;font-size:11px}
.bubble{box-shadow:0 5px 14px rgba(28,55,48,.06);padding:11px 13px}
.bubble.me{box-shadow:0 7px 15px rgba(11,122,97,.16)}
.chat-compose{padding:5px;background:rgba(255,255,255,.55);border:1px solid var(--border);border-radius:13px}
.chat-compose input{border:0;background:transparent;box-shadow:none;margin:0}.chat-compose input:focus{box-shadow:none}
.chat-compose button{width:68px;border-radius:10px;box-shadow:0 4px 10px rgba(11,122,97,.16)}
.map-box{height:310px;border-radius:18px;box-shadow:0 10px 25px rgba(28,55,48,.10)}
.map-actions{gap:9px}.map-actions button{border-radius:11px;transition:.18s}.map-actions button:hover{transform:translateY(-1px);box-shadow:0 5px 12px rgba(28,55,48,.08)}
.legend{padding:10px 11px;background:rgba(255,255,255,.65);border:1px solid var(--border);border-radius:11px}
.tabbar{height:70px;border-top:1px solid rgba(28,55,48,.09);box-shadow:0 -8px 25px rgba(28,55,48,.05)}
.tabbar button{font-size:10px;transition:.18s;position:relative}.tabbar button:hover{background:rgba(11,122,97,.04)}
.tabbar button.active:before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 5px 5px;background:var(--accent)}
.small-note{font-size:10.5px}
.empty{padding:24px 14px;background:rgba(255,255,255,.35);border-radius:12px;margin:4px 0}
@media(max-width:450px){body{padding:0}.phone{border-radius:0;min-height:100vh;width:100%}.phone:before{display:none}.content{min-height:calc(100vh - 70px)}}

/* Disaster palette refinement */
.phone.disaster{--bg:#fff5f2;--surface:rgba(255,255,255,.96);--border:rgba(145,55,45,.12);--text:#2a1614;--text-secondary:#8c4a3f;--accent:#c0392b;--accent-bg:#fde5e0;--shadow:0 18px 45px rgba(145,55,45,.12)}
.phone.disaster .brand:before{background:#c0392b;box-shadow:0 5px 12px rgba(192,57,43,.22)}
.phone.disaster .action-btn.primary{box-shadow:0 8px 18px rgba(192,57,43,.20)}

/* ===== New: onboarding/settings modal, helpline, location, media, mic, toast ===== */
.icon-btn{width:34px;height:34px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  display:grid;place-items:center;cursor:pointer;color:var(--text);flex-shrink:0}
.icon-btn:hover{border-color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:8px}
.modal-overlay{position:absolute;inset:0;background:rgba(15,25,22,.46);z-index:40;display:flex;
  align-items:flex-end;justify-content:center;border-radius:34px;backdrop-filter:blur(2px)}
.modal-box{width:100%;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:24px 24px 0 0;
  padding:22px 20px 26px;box-shadow:0 -20px 50px rgba(0,0,0,.25)}
.modal-box h2{margin:0 0 6px;font-size:18px;color:var(--text)}
.modal-box p.intro{font-size:12.5px;color:var(--text-secondary);margin:0 0 16px;line-height:1.5}
.lang-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.lang-grid button{padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  font-size:12.5px;cursor:pointer;color:var(--text);text-align:left}
.lang-grid button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.ai-toggle{display:flex;gap:8px;margin-bottom:14px}
.ai-toggle button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--border);background:var(--surface);
  font-size:12px;font-weight:600;cursor:pointer;color:var(--text)}
.ai-toggle button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:6px}
.modal-actions .action-btn{margin-bottom:0}
.text-btn{background:none;border:none;color:var(--text-secondary);font-size:12.5px;text-decoration:underline;
  cursor:pointer;padding:6px 0;width:100%;text-align:center}
.helpline-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px 12px;
  margin-bottom:14px;box-shadow:0 7px 20px rgba(28,55,48,.05)}
.helpline-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);
  margin:12px 0 4px;font-weight:700}
.helpline-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;
  border-bottom:1px solid var(--border);gap:10px}
.helpline-row:last-of-type{border-bottom:none}
.helpline-row .name{font-size:13px;color:var(--text);font-weight:600}
.helpline-row .num{font-size:12px;color:var(--text-secondary)}
.call-chip{display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:none;
  background:var(--accent);color:#fff;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0}
.helpline-note{font-size:10.5px;color:var(--text-secondary);line-height:1.4;margin:2px 0 10px}
.location-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px;
  margin-bottom:14px;box-shadow:0 7px 20px rgba(28,55,48,.05)}
.location-card h3{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--accent);
  margin:0 0 10px;font-weight:700}
.location-row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--text);
  padding:6px 0;border-bottom:1px solid var(--border)}
.location-row:last-of-type{border-bottom:none}
.location-row span.k{color:var(--text-secondary)}
.location-actions{display:flex;gap:8px;margin-top:10px}
.location-actions button{flex:1;padding:10px;border-radius:10px;border:none;background:var(--accent);
  color:#fff;font-size:12px;font-weight:700;cursor:pointer}
.location-actions button.secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}
.media-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.media-item{position:relative;border-radius:14px;overflow:hidden;background:var(--surface);
  border:1px solid var(--border);aspect-ratio:1/1}
.media-item img,.media-item video{width:100%;height:100%;object-fit:cover;display:block}
.media-item .del{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:50%;
  border:none;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:13px;line-height:1}
.media-add-row{display:flex;gap:8px;margin-bottom:4px}
.media-add-row .action-btn{margin-bottom:0}
.fab-mic{position:absolute;right:18px;bottom:86px;width:54px;height:54px;border-radius:50%;
  background:var(--accent);color:#fff;border:none;display:grid;place-items:center;font-size:20px;
  cursor:pointer;box-shadow:0 10px 24px rgba(11,122,97,.35);z-index:20;transition:transform .15s}
.phone.disaster .fab-mic{box-shadow:0 10px 24px rgba(192,57,43,.35)}
.fab-mic.listening{animation:pulse 1.1s infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.12)}100%{transform:scale(1)}}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:#17231f;color:#fff;
  padding:9px 16px;border-radius:999px;font-size:12px;z-index:50;box-shadow:0 10px 24px rgba(0,0,0,.25);
  max-width:88%;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>

function tr(key,vars){
  let s=(TR[state.language]&&TR[state.language][key])||TR.en[key]||key;
  if(vars) Object.keys(vars).forEach(k=>{ s=s.replace('{'+k+'}',vars[k]); });
  return s;
}

  {key:'hlEmergency',number:'112'},
  {key:'hlAmbulance',number:'108'},
  {key:'hlPolice',number:'100'},
  {key:'hlFire',number:'101'},

];

const INCIDENT_TYPES=['typeSupply','typeInjury','typeStructural','typeMissing','typeOther'];
const SEVERITIES=['sevLow','sevMed','sevHigh'];

/* ===================== State ===================== */
let state = {
  mode:'daily',
  tab:'home',
  community:'comAll',
  language: localStorage.getItem('lk_language') || 'en',
  userName: localStorage.getItem('lk_userName') || '',
  userPhone: localStorage.getItem('lk_userPhone') || '',
  geminiApiKey: localStorage.getItem('lk_geminiKey') || '',
  aiMode: localStorage.getItem('lk_aiMode') || 'online',
  onboarded: localStorage.getItem('lk_onboarded')==='1',
  settingsOpen:false,
  location:null,
  locationStatus:'idle',
  media: [],
  messages: JSON.parse(localStorage.getItem('lk_messages') || 'null') || [
    {community:'comAll',who:'them',name:'Dhruv',text:'Anyone near the north gate? We need another set of hands.',time:'2m ago'},
    {community:'comAll',who:'me',name:'You',text:'On my way, bringing the first-aid kit.',time:'1m ago'},
    {community:'comAll',who:'them',name:'Namit',text:'Logged it in the incident board so it stays on record.',time:'just now'}
  ],
  incidents: JSON.parse(localStorage.getItem('lk_incidents') || '[]'),
  journals: JSON.parse(localStorage.getItem('lk_journals') || '[]')
};

function persist(){
  localStorage.setItem('lk_messages', JSON.stringify(state.messages));
  localStorage.setItem('lk_incidents', JSON.stringify(state.incidents));
  localStorage.setItem('lk_journals', JSON.stringify(state.journals));
  localStorage.setItem('lk_language', state.language);
  localStorage.setItem('lk_userName', state.userName);
  localStorage.setItem('lk_userPhone', state.userPhone);
  localStorage.setItem('lk_geminiKey', state.geminiApiKey);
  localStorage.setItem('lk_aiMode', state.aiMode);
  localStorage.setItem('lk_onboarded', state.onboarded?'1':'0');
}

function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function now(){return new Date().toLocaleString([], {dateStyle:'medium',timeStyle:'short'});}

let toastTimer=null;
function showToast(msg){
  const phone=document.getElementById('phone');
  let el=document.getElementById('toast');
  if(!el){ el=document.createElement('div'); el.id='toast'; el.className='toast'; phone.appendChild(el); }
  el.textContent=msg;
  el.style.display='block';
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>{ if(el) el.style.display='none'; },3200);
}

/* ===================== Mode / tab ===================== */
function setMode(m){
  state.mode=m; state.tab='home'; render();
  if(m==='disaster') prepareDisasterInfo();
}
function setTab(t){ state.tab=t; render(); if(t==='map') setTimeout(initMap,50); }
function setLanguage(l){ state.language=l; persist(); render(); }
function selectCommunity(cKey){ state.community=cKey; render(); }

/* ===================== Onboarding ===================== */
function renderOnboarding(){
  const root=document.getElementById('modalRoot');
  if(!root) return;
  if(state.onboarded){ root.innerHTML=''; return; }
  root.innerHTML=`
    <div class="modal-overlay">
      <div class="modal-box">
        <h2>${tr('onboardTitle')}</h2>
        <p class="intro">${tr('onboardIntro')}</p>
        <p class="field-label">${tr('onboardName')}</p>
        <input type="text" id="obName" placeholder="${tr('onboardName')}">
        <p class="field-label">${tr('onboardPhone')}</p>
        <input type="text" id="obPhone" placeholder="+91 9XXXXXXXXX" inputmode="tel">
        <p class="small-note" style="margin:-10px 0 14px">${tr('onboardPhoneNote')}</p>
        <p class="field-label">${tr('onboardLanguage')}</p>
        <div class="lang-grid" id="obLangGrid">
          ${LANGUAGES.map(l=>`<button type="button" class="${state.language===l.code?'active':''}" data-lang="${l.code}">${l.label}</button>`).join('')}
        </div>
        <div class="modal-actions">
          <button class="action-btn primary" style="justify-content:center;flex:1" onclick="completeOnboarding()">${tr('onboardContinue')}</button>
        </div>
        <button class="text-btn" onclick="skipOnboarding()">${tr('onboardSkip')}</button>
      </div>
    </div>`;
  root.querySelectorAll('#obLangGrid button').forEach(b=>{
    b.onclick=()=>{ state.language=b.dataset.lang; renderOnboarding(); };
  });
}
function completeOnboarding(){
  const name=document.getElementById('obName').value.trim();
  const phone=document.getElementById('obPhone').value.trim();
  state.userName=name; state.userPhone=phone; state.onboarded=true;
  persist(); render();
}
function skipOnboarding(){ state.onboarded=true; persist(); render(); }

/* ===================== Settings ===================== */
function openSettings(){ state.settingsOpen=true; renderSettings(); }
function closeSettings(){ state.settingsOpen=false; renderSettings(); }
function renderSettings(){
  const root=document.getElementById('modalRoot');

/* ===================== AI guidance (Gemini online / offline stub) ===================== */
async function callGeminiAI(prompt){
  if(!state.geminiApiKey) return null;
  try{
    const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${encodeURIComponent(state.geminiApiKey)}`,{
      method:'POST', headers:{'Content-Type':'application/json'},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
    });
    if(!res.ok) return null;
    const data=await res.json();
    return (data && data.candidates && data.candidates[0] && data.candidates[0].content &&
      data.candidates[0].content.parts && data.candidates[0].content.parts[0] &&
      data.candidates[0].content.parts[0].text) || null;
  }catch(e){ console.error('Gemini API error',e); return null; }
}
async function offlineAIRespond(prompt){
  // Wire your on-device / offline model here. Contract:
  // window.offlineAIModel = { respond: async (promptText) => "model's text reply" };
  if(window.offlineAIModel && typeof window.offlineAIModel.respond==='function'){
    try{ return await window.offlineAIModel.respond(prompt); }catch(e){ console.error('Offline AI error',e); return null; }
  }
  return null;
}
async function refreshAIGuidance(){
  if(state.mode!=='disaster') return;
  const prompt=`You are a calm, practical disaster-response assistant for a community safety app called LifeKeeper. `+
    `In ${LANGUAGES.find(l=>l.code===state.language)?.label||'English'}, in 2 short sentences, give one piece of practical, `+
    `locally relevant safety guidance for someone currently in disaster mode. Open incidents logged so far: ${state.incidents.length}.`;
  let text=null;
  if(state.aiMode==='online' && navigator.onLine) text=await callGeminiAI(prompt);
  if(!text) text=await offlineAIRespond(prompt);
  const el=document.getElementById('aiGuidanceText');
  if(el) el.textContent = text || 'Water supply reported low in Sector 2. Choose a community below to coordinate with people nearby.';
}

let map; let mapMarkers=[];
let mapsScriptLoading=false; let mapsScriptLoaded=false;
function initMap(){
  const el=document.getElementById('google-map');
  if(!el) return;
  if(GOOGLE_MAPS_API_KEY==='YOUR_GOOGLE_MAPS_API_KEY'){
    el.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#6B6A63;font-size:13px;background:#e9ece8">Google Maps is ready to be connected.<br><br>Add your API key in <b>GOOGLE_MAPS_API_KEY</b> in this HTML file.</div>';
    return;
  }
  if(window.google && window.google.maps){ createLifeKeeperMap(); return; }
  if(mapsScriptLoading || mapsScriptLoaded) return;
  mapsScriptLoading=true;
  const s=document.createElement('script');
  s.src='https://maps.googleapis.com/maps/api/js?key='+encodeURIComponent(GOOGLE_MAPS_API_KEY)+'&callback=createLifeKeeperMap';
  s.async=true; s.defer=true;
  s.onerror=()=>{
    mapsScriptLoading=false;
    const target=document.getElementById('google-map');
    if(target) target.innerHTML='<div style="height:100%;display:flex;align-items:center;justify-content:center;text-align:center;padding:25px;color:#b3261e;font-size:13px">Google Maps could not be loaded.<br><br>Check the API key, Maps JavaScript API, and localhost key restrictions.</div>';
  };
  document.head.appendChild(s);
}
window.createLifeKeeperMap=function(){ mapsScriptLoading=false; mapsScriptLoaded=true; createLifeKeeperMapInstance(); };
function createLifeKeeperMap(){ createLifeKeeperMapInstance(); }
function createLifeKeeperMapInstance(){
  const el=document.getElementById('google-map'); if(!el) return;
  if(!navigator.geolocation){ loadMap({lat:12.9165,lng:79.1325}); return; }
  navigator.geolocation.getCurrentPosition(
    p=>loadMap({lat:p.coords.latitude,lng:p.coords.longitude}),
    ()=>loadMap({lat:12.9165,lng:79.1325}),
    {enableHighAccuracy:true,timeout:15000,maximumAge:60000}
  );
}
function loadMap(center){
  map=new google.maps.Map(document.getElementById('google-map'),{center,zoom:15,mapTypeControl:true,streetViewControl:false,fullscreenControl:false});
  mapMarkers=[];
  new google.maps.Marker({map,position:center,title:'Your current location',label:'You'});
  if(state.mode==='disaster'){
    addMarker({lat:center.lat+0.004,lng:center.lng+0.002},'Medical support','Medical');
    addMarker({lat:center.lat-0.003,lng:center.lng+0.004},'Engineering point','Engineering');
    addMarker({lat:center.lat+0.002,lng:center.lng-0.004},'Safe zone','Safe zone');
  }
}
function addMarker(position,title,kind){
  const marker=new google.maps.Marker({map,position,title});
  marker.addListener('click',()=>showToast(kind+': '+title));
  mapMarkers.push(marker);
}
function locateMe(){
  if(!map){initMap();return;}
  navigator.geolocation.getCurrentPosition(p=>{
    const pos={lat:p.coords.latitude,lng:p.coords.longitude};
    map.setCenter(pos); map.setZoom(16);
    new google.maps.Marker({map,position:pos,title:'Your current location'});
  });
}

/* ===================== Voice commands ===================== */
function langToSpeechCode(l){
  const map={en:'en-IN',hi:'hi-IN',ta:'ta-IN',te:'te-IN',kn:'kn-IN',ml:'ml-IN',bn:'bn-IN',mr:'mr-IN',gu:'gu-IN',pa:'pa-IN',ur:'ur-IN'};
  return map[l]||'en-IN';
}
function startVoiceCommand(){
  const SR=window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ showToast(tr('micNotSupported')); return; }
  const recognition=new SR();
  recognition.lang=langToSpeechCode(state.language);
  recognition.interimResults=false;
  recognition.maxAlternatives=1;
  const fab=document.getElementById('fabMic');
  if(fab) fab.classList.add('listening');
  showToast(tr('micListening'));
  try{ recognition.start(); }catch(e){ if(fab) fab.classList.remove('listening'); return; }
  recognition.onresult=(e)=>{
    const transcript=e.results[0][0].transcript;
    showToast(tr('micHeard',{text:transcript}));
    handleVoiceCommand(transcript);
  };
  recognition.onerror=()=>{ showToast(tr('micNotSupported')); };
  recognition.onend=()=>{ if(fab) fab.classList.remove('listening'); };
}
function handleVoiceCommand(raw){
  const t=raw.toLowerCase();
  const has=(...words)=>words.some(w=>t.includes(w));

  if(has('home','होम','ghar','ஹோம்')){ setTab('home'); return; }
  if(has('map','नक्शा','maps','नकाशा','வரைபடம்')){ setTab('map'); if(state.tab==='map') setTimeout(initMap,50); return; }
  if(has('chat','चैट','मेसेज','sandesh')){ setTab('chat'); return; }
  if(has('media','photo','video','फोटो','कैमरा','camera')){ setTab('media'); return; }
  if(has('setting','सेटिंग')){ openSettings(); return; }
  if(has('disaster','आपदा','emergency mode','आपातकाल')){ setMode('disaster'); return; }
  if(has('exit disaster','daily mode','सामान्य मोड')){ setMode('daily'); return; }
  if(has('call police','पुलिस बुलाओ')){ callNumber(HELPLINES.find(h=>h.key==='hlPolice').number); return; }
  if(has('call ambulance','एम्बुलेंस बुलाओ')){ callNumber(HELPLINES.find(h=>h.key==='hlAmbulance').number); return; }
  if(has('call emergency','emergency number','आपातकालीन नंबर')){ callNumber(HELPLINES.find(h=>h.key==='hlEmergency').number); return; }
  if(has('share location','share my location','स्थान भेजो','लोकेशन भेजो')){ setTab('home'); if(state.location) shareLocationWithAuthorities(); else prepareDisasterInfo(); return; }
  if(has('log incident','report incident','घटना दर्ज')){
    setTab('log');
    setTimeout(()=>{ const n=document.getElementById('incidentNotes'); if(n) n.value=raw; },80);
    return;
  }

  // Dictation fallback: drop the transcript into whichever textarea is visible.
  const journalBox=document.getElementById('journalText');
  const incidentBox=document.getElementById('incidentNotes');
  const chatBox=document.getElementById('chatInput');
  if(journalBox){ journalBox.value=(journalBox.value?journalBox.value+' ':'')+raw; return; }
  if(incidentBox){ incidentBox.value=(incidentBox.value?incidentBox.value+' ':'')+raw; return; }
  if(chatBox){ chatBox.value=(chatBox.value?chatBox.value+' ':'')+raw; return; }
}

      <button class="${state.mode==='daily'?'active':''}" onclick="setMode('daily')">${tr('modeDaily')}</button>
      <button class="${state.mode==='disaster'?'active':''}" onclick="setMode('disaster')">${tr('modeDisaster')}</button>
    </div>`;
  document.getElementById('content').innerHTML=top+screens[state.tab]();
  document.getElementById('banner').textContent='⚠ '+tr('disasterBanner');
  document.querySelectorAll('.tabbar button').forEach(b=>{
    b.classList.toggle('active',b.dataset.tab===state.tab);
    b.onclick=()=>setTab(b.dataset.tab);
  });
  document.getElementById('logTab').textContent=state.mode==='disaster'?tr('navLog'):tr('navJournal');
  document.getElementById('mediaTabLabel').textContent=tr('navMedia');
  if(state.tab==='map') setTimeout(initMap,50);
  if(state.tab==='home' && state.mode==='disaster') setTimeout(refreshAIGuidance,30);
  if(!state.onboarded) renderOnboarding(); else if(state.settingsOpen) renderSettings();
  else { const mr=document.getElementById('modalRoot'); if(mr) mr.innerHTML=''; }
}
render();

</script>
</body>
</html>
